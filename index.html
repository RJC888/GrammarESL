<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Grammar Coach</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">

    <header class="app-header">
      <h1>Grammar Coach</h1>
      <p class="subtitle">Fix Grammar Mistakes Easily</p>
    </header>

    <main>
      <!-- INPUT TEXT AREA -->
      <textarea id="inputText" class="input-box" placeholder="Type or speak a sentence or paragraph..."></textarea>

      <!-- CONTROL BAR (3 DROPDOWN COLUMNS) -->
      <div class="control-row">
        <div class="control-col">
          <label for="levelSelect">Level</label>
          <select id="levelSelect">
            <option value="simple">Simple</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
        <div class="control-col">
          <label for="inputLangSelect">Input</label>
          <select id="inputLangSelect">
            <option value="English">English</option>
            <option value="Spanish">Spanish</option>
            <option value="Catalan">Catalan</option>
          </select>
        </div>
        <div class="control-col">
          <label for="explainLangSelect">Explanation</label>
          <select id="explainLangSelect">
            <option value="English">English</option>
            <option value="Spanish">Spanish</option>
            <option value="Catalan">Catalan</option>
          </select>
        </div>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="action-row">
        <button id="micBtn" class="btn">🎙 Speak</button>
        <button id="checkBtn" class="btn primary-btn">✔ Check</button>
        <button id="clearBtn" class="btn">✖ Clear</button>
      </div>

      <!-- OUTPUT BOX -->
      <div id="outputBox" class="output-box">
        <p class="placeholder">Your feedback will appear here.</p>
      </div>
    </main>

    <script src="app.js"></script>
  </div>
</body>
</html>
