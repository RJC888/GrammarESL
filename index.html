<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ESL Grammar & Speaking Coach</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>ESL Grammar & Speaking Coach</h1>
      <p class="subtitle">
        Speak or type your English. Choose your help level. Get friendly feedback.
      </p>
    </header>

    <main class="app-main">
      <!-- Input Area -->
      <section class="card">
        <label class="field-label" for="inputText">Your English text</label>
        <textarea
          id="inputText"
          class="text-input"
          rows="6"
          placeholder="Type here or tap the mic and speak..."
        ></textarea>

        <div class="toolbar">
          <button id="micBtn" class="btn mic-btn">
            🎤 Tap to Speak
          </button>
          <span id="micStatus" class="status-label">Mic: off</span>
        </div>

        <!-- Tier selection -->
        <div class="tier-row">
          <span class="field-label">Help level:</span>
          <label class="tier-option">
            <input type="radio" name="tier" value="simple" />
            Simple
          </label>
          <label class="tier-option">
            <input type="radio" name="tier" value="intermediate" checked />
            Intermediate
          </label>
          <label class="tier-option">
            <input type="radio" name="tier" value="advanced" />
            Advanced
          </label>
        </div>

        <div class="actions">
          <button id="checkBtn" class="btn primary-btn">
            ✓ Check My Writing
          </button>
          <button id="clearBtn" class="btn secondary-btn">
            Clear
          </button>
        </div>
      </section>

      <!-- Results Area -->
      <section class="card results-card">
        <h2 class="results-title">Grammar Coach Feedback</h2>
        <div id="results" class="results">
          <p class="placeholder">
            Your feedback will appear here after you press
            <strong>“Check My Writing”</strong>.
          </p>
        </div>
      </section>
    </main>
  </div>

  <!-- Xenova Transformers Library (required for Whisper ASR) -->
<script src="https://cdn.jsdelivr.net/npm/@xenova/transformers/dist/transformers.min.js"></script>

  <!-- Transformers.js (Xenova) for Whisper base.en -->
  <script type="module">
    import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.3.0";

    // Expose pipeline globally so app.js can use it
    window.transformersPipeline = pipeline;
  </script>

  <!-- Main App Logic -->
  <script src="app.js"></script>
</body>
</html>
